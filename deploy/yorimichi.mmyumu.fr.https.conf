# Step 2: once the certificate exists, append this to the same conf.d file and reload.
server {
    listen 443 ssl;
    server_name yorimichi.mmyumu.fr;

    ssl_certificate     /etc/letsencrypt/live/yorimichi.mmyumu.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yorimichi.mmyumu.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $upstream_yorimichi "yorimichi:80";

    location / {
        proxy_pass http://$upstream_yorimichi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
