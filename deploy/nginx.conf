server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Revalidated on every load (ETag, a 304 when unchanged): the page, access.json, the manifest and photos/index.json, so that a new build or a new photo set shows at once.
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  # The encrypted photos never change under their random names.
  location ~ ^/photos/.+\.bin$ { expires 30d; }
}
