# Step 1: install in nginx conf.d, reload, then issue the certificate:
#   certbot certonly --webroot -w /var/www/certbot -d yorimichi.mmyumu.fr
server {
    listen 80;
    server_name yorimichi.mmyumu.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
